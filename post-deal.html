<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LastSlice — Post a Deal</title>
  <link rel="stylesheet" href="style1.css">
</head>
<body>

  <nav>
    <div class="logo" onclick="location.href='a.html'">
      Last<em>Slice</em> <span class="emoji-logo">&#127829;</span>
    </div>
    <div class="nav-buttons">
      <button onclick="location.href='b.html'">Browse Deals</button>
      <button onclick="location.href='signin.html'">Sign In</button>
    </div>
  </nav>

  <div class="page-wrap">
    <div class="form-card">

      <h2>&#127873; Post a Flash Deal</h2>
      <p class="sub">List your surplus food and help reduce waste — completely free.</p>

      <div class="error-msg" id="error-msg">Please fill in all required fields.</div>

      <div class="section-heading-sm">Shop Info</div>

      <div class="form-group">
        <label>Shop Name *</label>
        <input type="text" id="shop-name" placeholder="e.g. Golden Crust Bakery">
      </div>

      <div class="row-2">
        <div class="form-group">
          <label>Category *</label>
          <select id="category">
            <option value="">Select...</option>
            <option>Bakery</option>
            <option>Cafe</option>
            <option>Pastry</option>
            <option>Sandwiches</option>
            <option>Other</option>
          </select>
        </div>
        <div class="form-group">
          <label>Distance from Centre</label>
          <input type="text" id="distance" placeholder="e.g. 0.5 km">
        </div>
      </div>

      <hr class="section-divider">

      <div class="section-heading-sm">Deal Details</div>

      <div class="form-group">
        <label>Item Name *</label>
        <input type="text" id="item-name" placeholder="e.g. Almond Croissant Trio">
      </div>

      <div class="form-group">
        <label>Description</label>
        <textarea id="description" placeholder="Describe what's included..."></textarea>
      </div>

      <div class="price-row">
        <div class="form-group">
          <label>Original Price (₹) *</label>
          <input type="number" id="original-price" placeholder="240" oninput="calcDiscount()">
        </div>
        <div class="form-group">
          <label>Deal Price (₹) *</label>
          <input type="number" id="deal-price" placeholder="120" oninput="calcDiscount()">
        </div>
        <div class="discount-badge" id="discount-display">— % off</div>
      </div>

      <div class="row-2">
        <div class="form-group">
          <label>Quantity Left *</label>
          <input type="number" id="quantity" placeholder="4" min="1">
        </div>
        <div class="form-group">
          <label>Deal Expires At *</label>
          <input type="time" id="expiry">
        </div>
      </div>

      <button class="submit-btn" id="submit-btn" onclick="submitDeal()">Post Deal Live &#128640;</button>

      <div class="success-box" id="success-box">
        <span class="big-icon">&#127881;</span>
        <h3>Your deal is live!</h3>
        <p>Customers nearby can now see and claim it.</p>
        <button class="back-btn" onclick="location.href='b.html'">See All Deals →</button>
      </div>

    </div>
  </div>

  <script src="post-deal.js"></script>

</body>
</html>
